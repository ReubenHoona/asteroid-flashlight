<?xml version="1.0" encoding="UTF-8"?>
<!-- The Flashlight's launcher icon, drawn for AsteroidOS after the description
     of the stock Wear OS icon (an adaptive icon, 108 dp square): a white
     background and a blue torch about 30 x 52 dp, centred: the body #336ef3,
     the head a light blue gradient (#74b9ff to #add7fe) with a pale highlight
     (#def0f9), an oval navy switch (#2c3796). The torch box is x 39 to 69, y 28
     to 80 of the 108. The launcher draws it untinted on a circle. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108" width="108" height="108">
  <defs>
    <linearGradient id="head" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#74b9ff"/>
      <stop offset="1" stop-color="#add7fe"/>
    </linearGradient>
  </defs>
  <circle cx="54" cy="54" r="54" fill="#ffffff"/>
  <path fill="#336ef3" d="M45,43L63,43L63,74.67Q63,79.67 58,79.67L50,79.67Q45,79.67 45,74.67Z"/>
  <path fill="url(#head)" d="M42,28L66,28Q69,28 69,31L63,45L45,45L39,31Q39,28 42,28Z"/>
  <rect fill="#def0f9" x="42" y="30" width="24" height="2.4" rx="1.2"/>
  <ellipse fill="#2c3796" cx="54" cy="58" rx="3" ry="5"/>
</svg>
